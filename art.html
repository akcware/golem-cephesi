<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golem Cephesi — Sanat Galerisi</title>
    <style>
      html,
      body {
        margin: 0;
        background: #20232c;
        color: #e8e8f0;
        font: 13px/1.3 system-ui, sans-serif;
      }
      #nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        gap: 6px;
        padding: 4px 8px;
        background: rgba(10, 12, 18, 0.85);
      }
      #nav a {
        color: #9fc4ff;
        text-decoration: none;
        padding: 2px 6px;
        border-radius: 4px;
        background: #2c3242;
      }
      #nav span {
        margin-left: auto;
        color: #ffd36b;
      }
      #game {
        padding-top: 0;
      }
      #icons {
        padding: 34px 12px 12px;
        display: none;
      }
      #icons .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      #icons .cell {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        background: linear-gradient(#3a4256, #262b38);
        border: 2px solid #4b5570;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #icons .cell.small {
        width: 44px;
        height: 44px;
      }
      #icons img {
        width: 56px;
        height: 56px;
      }
      #icons .small img {
        width: 36px;
        height: 36px;
      }
      #icons .lbl {
        width: 70px;
        color: #aab;
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <div id="game"></div>
    <div id="icons"></div>
    <script type="module" src="/client/art-preview.ts"></script>
  </body>
</html>
