# Render'ın ücretsiz planı 15 dakika istek gelmeyince sunucuyu uyutur; ilk bağlantı ~50 sn sürer.
# Bu iş sunucuyu 10 dakikada bir dürterek uyanık tutar (App Store incelemesi ve oyuncular için).
# Not: GitHub zamanlanmış işleri birkaç dakika gecikmeli çalıştırabilir ve depoda 60 gün hiç
# hareket olmazsa kapatır; o zaman Actions sekmesinden yeniden aç.
name: Sunucuyu uyanık tut

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://golem-cephesi.onrender.com/health
