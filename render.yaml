# Render Blueprint: tek web servisi hem oyun sunucusunu (Colyseus/WebSocket) hem derlenmiş sayfayı sunar.
services:
  - type: web
    name: golem-forge
    runtime: node
    plan: free
    # Vite (derleme) ve tsx (çalıştırma) geliştirme paketlerinde; onları da kur
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
